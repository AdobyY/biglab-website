{% load wagtailcore_tags ui_tags %}
{% ui 'simulation' as default_title %}
{% if value.is_visible %}
<section{% include "home/includes/section_attributes.html" %}>
  <div class="section-shell builder-embed">
    <div class="section-heading"><h2>{{ value.title|default:default_title }}</h2></div>
    {% if value.intro %}<div class="collection-intro reading-content">{{ value.intro|richtext }}</div>{% endif %}
    {% if value.description %}<p class="intro">{{ value.description }}</p>{% endif %}
    <iframe class="builder-simulation responsive-embed" src="{{ value.embed_url }}" title="{{ value.title|default:default_title }}" loading="lazy" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
  </div>
</section>
{% endif %}
