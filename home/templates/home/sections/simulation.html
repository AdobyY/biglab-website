{% load navigation_tags %}{% section_background_url value as background_url %}
{% if value.is_visible %}<section{% if value.anchor %} id="{{ value.anchor }}"{% endif %} class="builder-section section-theme-{{ value.theme }}{% if background_url %} has-section-background background-overlay-{{ value.background_overlay }}{% endif %}"{% if background_url %} style="--section-bg:url('{{ background_url }}');--section-bg-position:{{ value.background_position }}"{% endif %}><div class="section-shell builder-embed">{% if value.title %}<h2>{{ value.title }}</h2>{% endif %}{% if value.description %}<p class="intro">{{ value.description }}</p>{% endif %}<iframe class="builder-simulation" src="{{ value.embed_url }}" title="{{ value.title|default:'Interactive simulation' }}" loading="lazy"></iframe></div></section>{% endif %}
