{% load wagtailcore_tags navigation_tags %}{% section_background_url value as background_url %}
{% if value.is_visible %}<section{% if value.anchor %} id="{{ value.anchor }}"{% endif %} class="builder-section section-theme-{{ value.theme }}{% if background_url %} has-section-background background-overlay-{{ value.background_overlay }}{% endif %}"{% if background_url %} style="--section-bg:url('{{ background_url }}');--section-bg-position:{{ value.background_position }}"{% endif %}><div class="section-shell builder-embed"><div class="builder-section-heading">{% if value.title %}<h2>{{ value.title }}</h2>{% endif %}{% if value.intro %}<div class="intro">{{ value.intro|richtext }}</div>{% endif %}</div><div class="responsive-embed">{% include_block value.video %}</div></div></section>{% endif %}
