{% extends "base.html" %}
{% load wagtailimages_tags wagtailcore_tags ui_tags %}
{% block content %}
<article class="content-page">
  <header class="page-heading"><h1>{{ page.title }}</h1>{% if page.intro %}<div class="intro collection-intro">{{ page.intro|richtext }}</div>{% endif %}</header>
  {% if page.cover_image %}<figure class="content-cover">{% image page.cover_image width-1600 %}</figure>{% endif %}
  {% include "home/includes/page_content.html" %}
</article>
{% endblock %}
