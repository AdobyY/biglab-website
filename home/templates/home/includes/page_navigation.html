{% load wagtailcore_tags ui_tags %}
{% if previous_page or next_page %}
<nav class="page-navigation section-shell" aria-label="{% ui 'related_pages' %}">
  {% if previous_page %}<a rel="prev" href="{% pageurl previous_page %}"><span>{% ui previous_label %}</span><strong>{{ previous_page.title }}</strong></a>{% endif %}
  {% if next_page %}<a rel="next" href="{% pageurl next_page %}"><span>{% ui next_label %}</span><strong>{{ next_page.title }}</strong></a>{% endif %}
</nav>
{% endif %}
