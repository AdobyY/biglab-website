{% load ui_tags %}
<ul class="{% if nested %}submenu{% else %}site-nav{% endif %}"{% if nested %} id="submenu-{{ parent_id }}"{% endif %}>
  {% for item in menu_items %}
    <li class="{% if item.children %}has-submenu {% endif %}{% if item.active %}active-branch{% endif %}">
      <div class="nav-entry">
        <a href="{{ item.url }}"{% if item.current %} aria-current="page"{% endif %}>{{ item.page.title }}</a>
        {% if item.children %}<button class="submenu-toggle" type="button" aria-expanded="false" aria-controls="submenu-{{ item.page.id }}" aria-label="{% ui 'contents' %}: {{ item.page.title }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5 5 5-5"/></svg></button>{% endif %}
      </div>
      {% if item.children %}{% include "home/includes/navigation_menu.html" with menu_items=item.children nested=True parent_id=item.page.id %}{% endif %}
    </li>
  {% endfor %}
</ul>
